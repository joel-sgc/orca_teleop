[project]
name = "orca_teleop"
version = "0.1.0"
description = "A teleoperation stack for the ORCA hand"
authors = [
    {name = "Maximilian Eberlein", email = "meberlein@ethz.ch"},
    {name = "Francesco Capuano", email = "capuano@robots.ox.ac.uk"}
]
readme = "README.md"
# Capped below 3.13: mediapipe-numpy2 (the `mediapipe` extra) and orca_sim only
# ship wheels through cp312, so 3.13 fails to resolve.
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=2.0.0,<3.0.0",
    "torch>=2.8.0",
    "pytorch-kinematics",
    "grpcio>=1.62.3",
    "protobuf>=4.25.9,<5",
    "orca_core @ git+https://github.com/orcahand/orca_core.git@main",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]
mediapipe = [
    "mediapipe-numpy2",
    "opencv-python",
]
adaptive = [
    "cmeel-tinyxml2<11",
    "cmeel-urdfdom<5",
    "nlopt",
    "pin>=3.8.0",
    "pyyaml",
]
avp = [
    "avp-stream>=1.0,<2.0",
]
metaquest = [
    "aiohttp>=3.10",
]
manus = [
    "pyzmq>=25.0",
    "manus-client @ https://github.com/orcahand/manus-client/releases/download/v0.1.0/manus_client-0.1.0-py3-none-manylinux_2_35_x86_64.whl",
]
wilor = [
    # Headless build: WiLorCameraSource only captures/encodes frames, never
    # displays them, so it doesn't need opencv-python's GUI (libGL) deps.
    "opencv-python-headless",
    # webpolicy 0.1.0 requires Python>=3.11; the project floor is 3.10 for
    # its other extras, so this is scoped rather than raising requires-python.
    "webpolicy; python_version >= '3.11'",
]
sim = [
    "orca_sim @ git+https://github.com/orcahand/orca_sim.git@main"
]
leap = [
    "leapc_cffi",
    "leap",
]
learning = [
    # `uv sync --extra learning` is enough for dataset recording/training.
    "orca_teleop[mediapipe,metaquest,adaptive]",
    "lerobot>=0.4,<0.5",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orca_teleop"]
artifacts = [
    "src/orca_teleop/ingress/*.proto",
    "src/orca_teleop/ingress/metaquest/web/*",
    "src/orca_teleop/retargeting/configs/*.yaml",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/scripts",
    "/README.md",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
webpolicy = { git = "https://github.com/mhyatt000/webpolicy" }
# Local, editable checkout — not the pinned upstream @main — so this picks up
# live orca_core changes (disabled_motor_ids/disabled_joint_ids and friends)
# without waiting for them to land upstream.
orca_core = { path = "../", editable = true }
# leapc_cffi's setup.py builds against a local Ultraleap Gemini Hand Tracking
# install (LeapC.h + libLeapC.so) — on NixOS those are provided via FHS-path
# symlinks (services.ultraleap in ~/.nixos), not a real /usr install. Since
# Gemini isn't present on every machine this project runs on, `uv sync`
# (which always re-resolves every optional-dependency's build, not just the
# ones selected by --extra) would break project-wide without it — so this is
# scoped to a machine that actually has Gemini installed.
#
# `path`, not `git`: setup.py copies LeapC.h/libLeapC.so into its own source
# tree at build time (see LEAPC_HEADER_OVERRIDE/LEAPC_LIB_OVERRIDE below),
# but uv's git-checkout cache is deliberately read-only, so that copy fails
# with a PermissionError regardless of --no-cache. A plain `git clone` (not
# uv's) is a normal writable directory, so a local path sidesteps it. Clone
# as a sibling of this checkout:
#   cd ../ && git clone https://github.com/ultraleap/leapc-python-bindings
leapc_cffi = { path = "../leapc-python-bindings/leapc-cffi" }
leap = { path = "../leapc-python-bindings/leapc-python-api" }
